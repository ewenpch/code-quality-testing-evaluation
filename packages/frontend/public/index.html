<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Product management system" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <title>Product Management System</title>

    <!--
      Applies the persisted theme before first paint so the page never flashes
      the wrong colour scheme. Kept inline and synchronous on purpose: moving it
      into the bundle would run after React mounts.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('theme');
          var prefersDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);

          if (prefersDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* storage unavailable: fall back to the light theme */
        }
      })();
    </script>

    <!--
      Critical CSS for the pre-hydration splash only. Everything else is served
      by Tailwind from src/styles/index.css; `color-scheme` and the colour-scheme
      media query keep this splash readable before the stylesheet loads.
    -->
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, system-ui, sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f172a;
          color: #f1f5f9;
        }
      }

      #root {
        min-height: 100vh;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        color: #64748b;
        font-size: 1.2em;
      }

      .error {
        color: #b91c1c;
        text-align: center;
        padding: 20px;
      }
    </style>

    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>

    <div id="root">
      <div class="loading">Loading Application...</div>
    </div>

    <div id="error-container" style="display: none" class="error">
      An error occurred while loading the application.
    </div>

    <script>
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        console.error('Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo);
        document.getElementById('error-container').style.display = 'block';
        return false;
      };
    </script>
  </body>
</html>
